name: Build Seagull DevStudio ARM64 APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant Execute Permission to Scripts
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/*.sh 2>/dev/null || true

      - name: Build Ubuntu Container Assets
        run: |
          ./scripts/build-ubuntu-rootfs.sh

      - name: Assemble ARM64 Debug Package
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify Output APK
        run: |
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seagull-devstudio-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
