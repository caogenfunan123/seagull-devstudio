# build-apk.yml — 云端从源重建 dsh-mobile APK（自包含，宿主=本 APK 仓库）
#
# 目标：源码更新后云端能「从源重建快照 + 打包 APK」，不依赖协调库。
# 整套构建链（build-snapshot/inject/门禁脚本、@dsh-android 插件、插架子仓库、vendor、底座、LICENSES）
# 均随本仓库提交；本 workflow 只操作本仓库（GITHUB_REPOSITORY = dsh-mobile-apk）。
#
# 流程：检出自仓库(node/python/java) -> npm 构建 6 个缺 lib/ 的插件 -> stage 底座 base/
#       -> node scripts/build-snapshot-013.mjs <abi>（Termux 源装配 + 注入 + 门禁 + 归档）
#       -> node scripts/build-apk.mjs <abi>（注入插件 + 门禁 + gradle + 产物）
#       -> 上传 APK 到 GitHub Release（softprops/action-gh-release，绕过 artifact 配额）。
# 注：build-snapshot（Termux 包下载 + 归档压缩）+ 插件 npm 构建较重，需一次 dry-run 迭代验证。

name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      abi:
        description: '目标 ABI'
        type: choice
        options: [arm64]
        default: 'arm64'
      suffix:
        description: 'APK 版本后缀（默认空=正式版纯净版本号；测试构建显式传 -fix 等）'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Seagull fork：仅 arm64（用户设备即 arm64，x86_64 不再构建）
        abi: [arm64]
      fail-fast: false
    env:
      # build-apk.mjs 依赖本仓库顶层 scripts/plugins/vendor/base；apk 仓库 = $GITHUB_WORKSPACE
      DSH_APK_DIR: ${{ github.workspace }}
    steps:
      - name: 检出本仓库（不含 LFS——fork 未传底座对象，改由下步从上游直连下载）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: 准备运行时（node；dsh-client-ui-responsive 的 tsdown 要求 node ^22.18 || >=24.11）
        uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: python -> python3（脚本用 `python`）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python-is-python3 || sudo ln -sf /usr/bin/python3 /usr/bin/python
          python --version
      - name: 准备 Java（gradle 需要）
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: 构建插件（含 Seagull 新增纯 JS 插件；dsh-host-web-compat 用已提交 lib）
        shell: bash
        run: |
          set -e
          for d in plugins/dsh-android-bridge plugins/dsh-android-manage plugins/dsh-android-linux-env plugins/dsh-android-file-open dsh-shell-termux dsh-client-ui-responsive; do
            echo "== npm build $d =="
            (cd "$d" && npm install --no-audit --no-fund && npm run build)
          done
          # Seagull 纯 JS 插件：src -> lib 直拷（无 npm 依赖）
          for p in seagull root-ops dev-tools apk-tools tool-installer disk-maintainer backup; do
            echo "== build plugin $p =="
            node scripts/build-plugin.mjs "$p"
          done

      - name: stage 底座归档（base/ -> .deploy-tmp/<base-dir>/；LFS 指针则从上游直连下载）
        shell: bash
        run: |
          set -e
          abi="${{ matrix.abi }}"
          # build-snapshot-013.mjs 的 BASE_DIR：arm64 -> arm64-base；x86_64 -> x64-base（缩写，勿写 x86_64-base）
          if [ "$abi" = "arm64" ]; then bdir="arm64-base"; else bdir="x64-base"; fi
          mkdir -p ".deploy-tmp/${bdir}"
          # fork 未上传 LFS 底座对象：base-usr-*.tar.xz 是 133B LFS 指针 → 从上游 media 直连下载真实归档
          if [ ! -s "base/base-usr-${abi}.tar.xz" ] || [ "$(wc -c < base/base-usr-${abi}.tar.xz)" -lt 1000 ]; then
            echo "::warning:: base-usr-${abi}.tar.xz 为 LFS 指针，从上游 kelai141/dsh-mobile-apk 直连下载"
            curl -sL -o base/base-usr-${abi}.tar.xz \
              "https://media.githubusercontent.com/media/kelai141/dsh-mobile-apk/main/base/base-usr-${abi}.tar.xz"
          fi
          test -s "base/base-usr-${abi}.tar.xz" || { echo "缺 base/base-usr-${abi}.tar.xz"; exit 1; }
          cp "base/base-usr-${abi}.tar.xz" ".deploy-tmp/${bdir}/base-usr.tar.xz"
          # base-dsh 同样是 LFS 指针（133B）→ 直连上游下载真实归档（含 home/.dsh 配置层）
          if [ ! -s "base/base-dsh.tar.xz" ] || [ "$(wc -c < base/base-dsh.tar.xz)" -lt 1000 ]; then
            echo "::warning:: base-dsh.tar.xz 为 LFS 指针，从上游 kelai141/dsh-mobile-apk 直连下载"
            curl -sL -o base/base-dsh.tar.xz \
              "https://media.githubusercontent.com/media/kelai141/dsh-mobile-apk/main/base/base-dsh.tar.xz"
          fi
          if [ -f "base/base-dsh.tar.xz" ] && [ "$(wc -c < base/base-dsh.tar.xz)" -ge 1000 ]; then
            cp "base/base-dsh.tar.xz" ".deploy-tmp/${bdir}/base-dsh.tar.xz"
          fi
          du -sh ".deploy-tmp/${bdir}"

      - name: 构建快照 ${abi}（build-snapshot，Termux 源装配 + 注入 + 门禁 + 归档）
        shell: bash
        run: |
          set -e
          if ! node scripts/build-snapshot-013.mjs "${{ matrix.abi }}"; then
            echo "::warning:: 从源重建快照失败，回退下载上游官方快照（仅当上游已发布）"
            mkdir -p ".deploy-tmp/snapshot-013/${{ matrix.abi }}"
            # 回退版本随当前版本变量（2026-10 第三轮复盘 P2）：原硬编码 v0.13.1，
            # 0.13.4 时代会静默回退三个版本前的快照（引擎+插件全旧）装机。
            # VER 从 app/build.gradle.kts 的 versionName 推导，与 gradle 单一来源一致。
            VER="v$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
            echo "::warning:: 回退下载上游快照版本 ${VER}"
            curl -sL -o ".deploy-tmp/snapshot-013/${{ matrix.abi }}/snapshot.tar.xz" \
              "https://github.com/kelai141/dsh-mobile-apk/releases/download/${VER}/snapshot-${{ matrix.abi }}.tar.xz"
            test -s ".deploy-tmp/snapshot-013/${{ matrix.abi }}/snapshot.tar.xz" || { echo "快照回退下载失败"; exit 1; }
          fi

      - name: 拉取内置工具与 Ubuntu rootfs 资产（CI 自给自足，大文件不入库）
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.abi }}" = "arm64" ]; then
            mkdir -p app/src/main/assets/tools
            # 轻资产化（2026-09-18 P2）：仅保留 apktool（22M，使用频度高）随包；
            # jadx/radare2/rizin（合计 ~152M）改 tool-installer 在线安装（在线为主，sha256 内置校验）。
            curl -sL -o app/src/main/assets/tools/apktool.jar \
              "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar"
            test -s app/src/main/assets/tools/apktool.jar || { echo "apktool 下载失败"; exit 1; }
            # Ubuntu 24.04 rootfs：proot-distro 官方 minbase 原样入包（arm64 约 65M）。
            # 不再 CI qemu 注入编译工具链（省 ~234M）；工具链改设备端
            # dev-tools `ubuntu_toolchain_install`（root chroot 内 apt 真机实测全绿，坑 38）。
            curl -sL -o app/src/main/assets/ubuntu-rootfs.tar.xz \
              "https://github.com/termux/proot-distro/releases/download/v4.18.0/ubuntu-noble-aarch64-pd-v4.18.0.tar.xz"
            test -s app/src/main/assets/ubuntu-rootfs.tar.xz || { echo "minbase rootfs 下载失败"; exit 1; }
            du -sh app/src/main/assets/tools app/src/main/assets/ubuntu-rootfs.tar.xz
          fi

      - name: 构建 APK ${abi}（注入插件 + 门禁 + gradle + 产物）
        shell: bash
        run: |
          set -e
          node scripts/build-apk.mjs --abi "${{ matrix.abi }}" --suffix "${{ github.event.inputs.suffix }}"

      - name: 上传 APK 到 Release（绕过 artifact 配额）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: Seagull DevStudio APK arm64 (build ${{ github.run_id }})
          body: |
            自动构建产物（Seagull DevStudio fork，arm64）。
            提交：${{ github.sha }}
          files: out/v0.13.4-seagull/*.apk
